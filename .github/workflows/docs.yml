---
name: Docs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdown-link-check:
    if: ${{ (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Broken Links
    runs-on: codebuild-fotoshi-gh-planetiler-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # don't need to check planetiler-openmaptiles
          submodules: false
      - name: Run link check
        uses: gaurav-nelson/github-action-markdown-link-check@1.0.13
        with:
          use-quiet-mode: 'no'
          use-verbose-mode: 'yes'
          config-file: '.github/workflows/docs_mlc_config.json'
